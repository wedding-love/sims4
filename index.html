<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Артём &amp; Ольга — Wedding Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; }
    body { color: #242424; font-family: "Cormorant Garamond", Georgia, serif; }
    .page {
      width: min(100%, 1000px); min-height: 100vh; margin: 0 auto;
      padding: 38px 20px 24px; display: flex; flex-direction: column;
      align-items: center; background: #fff;
    }
    .title {
      margin: 0; color: #252525; font-family: "Parisienne", "Brush Script MT", cursive;
      font-size: clamp(48px, 8vw, 76px); font-weight: 400;
      line-height: 1.15; text-align: center;
    }
    .names {
      margin: 7px 0 0; color: #202020;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(34px, 6vw, 54px); font-weight: 500;
      letter-spacing: .035em; line-height: 1.15; text-align: center;
    }
    .ampersand {
      display: inline-block; padding: 0 .12em; color: #777;
      font-family: "Parisienne", cursive; font-size: .9em; font-weight: 400;
    }
    .image-wrap {
      width: min(100%, 760px); margin: 18px auto 0;
      display: flex; justify-content: center; align-items: center;
    }
    .couple-image { display: block; width: 100%; height: auto; object-fit: contain; }
    @media (max-width: 600px) {
      .page { padding: 28px 10px 16px; }
      .image-wrap { margin-top: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">Wedding Day</h1>
    <p class="names">Артём <span class="ampersand">&amp;</span> Ольга</p>
    <div class="image-wrap">
      <img class="couple-image" src="Помолвка в стиле Sims 4.png" alt="Артём и Ольга — помолвка в стиле The Sims 4">
    </div>
  </main>
</body>
</html>
